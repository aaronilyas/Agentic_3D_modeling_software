name: ci

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the project
        run: python -m pip install -e .
      - name: Harness
        env:
          JEWELRY_TEST_ADAPTER: jewelry.adapter:create_application
        run: python -m tests.run harness
      - name: Fast
        env:
          JEWELRY_TEST_ADAPTER: jewelry.adapter:create_application
        run: python -m tests.run fast
      - name: Integration
        env:
          JEWELRY_TEST_ADAPTER: jewelry.adapter:create_application
        run: python -m tests.run integration
