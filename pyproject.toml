[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-jewelry-cad"
version = "0.1.0"
description = "Analytic jewelry CAD kernel, document transactions, and manufacturing checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "manifold3d>=3.0,<4",
]

[tool.setuptools.packages.find]
include = ["jewelry*"]
exclude = ["tests*"]
