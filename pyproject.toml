[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-jewelry-cad"
version = "0.2.0"
description = "Agent-first parametric CAD with an OpenCascade feature graph and an optional jewelry domain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "manifold3d>=3.0,<4",
    "build123d>=0.13,<0.14",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7", "pyvista>=0.46,<0.50", "pyvistaqt>=0.11,<0.14"]

[project.scripts]
jewelry-cad = "jewelry.gui.main:main"
agentic-cad = "cad.gui.main:main"

[tool.setuptools.packages.find]
include = ["jewelry*", "cad*"]
exclude = ["tests*"]
